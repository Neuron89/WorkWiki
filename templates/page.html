{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
    <div class="page-header">
        <h1>{{ title }}</h1>
        <div class="page-actions">
            <a href="{{ url_for('edit_page', title=title) }}" class="button">Edit</a>
        </div>
    </div>

    <div class="page-content">
        {{ content|safe }}
    </div>
{% endblock %}
